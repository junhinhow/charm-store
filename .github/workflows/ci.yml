name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# A implementação vive em charm-suite/.github/workflows/go-ci.yml.
# Assim a suíte inteira tem uma única definição de CI.
jobs:
  ci:
    uses: junhinhow/charm-suite/.github/workflows/go-ci.yml@main